<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#00e5ff" />
    <meta
      name="description"
      content="Neon mech arena shooter with destructible voxel enemies. Play offline."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Shatter Arena" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Metal Shatter Arena" />
    <meta
      property="og:description"
      content="Neon mech arena shooter with destructible voxel enemies. Play offline."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://github.com/SiliconValley007/Metal-Shatter-Arena/icon-512.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="https://github.com/SiliconValley007/Metal-Shatter-Arena/icon-512.png"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Metal Shatter Arena</title>
    <style>
      :root {
        --bg: #0a0a0f;
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      button,
      input,
      a {
        touch-action: manipulation;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: var(--bg);
        overflow: hidden;
        font-family: ui-monospace, monospace;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      }
      #c {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: env(safe-area-inset-left, 0);
        right: env(safe-area-inset-right, 0);
        padding: 10px 14px;
        color: #eaffff;
        pointer-events: none;
        font-size: 13px;
        letter-spacing: 0.04em;
        background: linear-gradient(180deg, rgba(0, 20, 25, 0.62), transparent);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(0, 255, 255, 0.18);
        z-index: 2;
        text-shadow: 0 0 8px #0ff6;
      }
      .hudrow {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        align-items: center;
      }
      .meters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin-top: 6px;
        align-items: center;
      }
      .meter {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .meter span {
        opacity: 0.75;
        font-size: 11px;
      }
      #heat,
      #shld {
        width: 140px;
        height: 10px;
        background: #0006;
        border: 1px solid #0ff5;
        border-radius: 4px;
        overflow: hidden;
      }
      #heatfill {
        height: 100%;
        background: linear-gradient(90deg, #00ff9c, #ffe14a, #ff3b3b);
        width: 0%;
        box-shadow: 0 0 8px #0f08;
        will-change: width;
      }
      #shldfill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #003344, #00e5ff);
        box-shadow: 0 0 8px #0ff8;
        will-change: width;
      }
      .stick {
        position: fixed;
        bottom: max(20px, env(safe-area-inset-bottom, 0px));
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(0, 255, 255, 0.06);
        border: 1px solid rgba(0, 255, 255, 0.35);
        backdrop-filter: blur(3px);
        z-index: 3;
      }
      body:not(.touch) .stick {
        display: none;
      }
      #wpn {
        position: fixed;
        bottom: max(10px, env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        color: #0ff;
        font-size: 12px;
        pointer-events: auto;
        background: rgba(0, 20, 25, 0.55);
        border: 1px solid rgba(0, 255, 255, 0.35);
        padding: 8px 12px;
        min-height: 44px;
        border-radius: 6px;
        backdrop-filter: blur(6px);
        z-index: 3;
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 168px);
      }
      #wpn b {
        color: #fff;
        text-shadow: 0 0 8px #0ff;
      }
      .stick .nub {
        position: absolute;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(0, 255, 255, 0.4);
        left: 35px;
        top: 35px;
        box-shadow: 0 0 10px #0ff8;
        pointer-events: none;
      }
      #l {
        left: max(20px, env(safe-area-inset-left, 0px));
      }
      #r {
        right: max(20px, env(safe-area-inset-right, 0px));
      }
      #shbtn {
        position: fixed;
        bottom: max(150px, calc(env(safe-area-inset-bottom, 0px) + 140px));
        right: max(20px, env(safe-area-inset-right, 0px));
        min-width: 56px;
        min-height: 56px;
        border-radius: 50%;
        color: #0ff;
        background: rgba(0, 20, 25, 0.55);
        border: 1px solid rgba(0, 255, 255, 0.4);
        z-index: 3;
        pointer-events: auto;
        font:
          12px ui-monospace,
          monospace;
        cursor: pointer;
        display: none;
      }
      body.touch #shbtn {
        display: block;
      }
      #shbtn.on {
        background: rgba(0, 229, 255, 0.35);
        box-shadow: 0 0 14px #0ff8;
      }
      #pause {
        position: fixed;
        top: max(10px, env(safe-area-inset-top, 0px));
        right: max(10px, env(safe-area-inset-right, 0px));
        color: #0ff;
        background: rgba(0, 20, 25, 0.5);
        border: 1px solid rgba(0, 255, 255, 0.4);
        min-width: 44px;
        min-height: 44px;
        padding: 6px 12px;
        pointer-events: auto;
        font-size: 16px;
        border-radius: 6px;
        backdrop-filter: blur(6px);
        z-index: 4;
        cursor: pointer;
        box-shadow: 0 0 12px #0ff3;
      }
      #menu,
      #gameover {
        position: fixed;
        inset: 0;
        background: #000c;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
      }
      #menu {
        color: #fff;
      }
      #gameover {
        color: #f55;
        z-index: 11;
      }
      #menu button,
      #gameover button {
        padding: 10px 24px;
        min-height: 44px;
        min-width: 120px;
        background: rgba(0, 20, 25, 0.7);
        border: 1px solid #0ff;
        color: #0ff;
        font-family: inherit;
        border-radius: 6px;
        cursor: pointer;
      }
      #gameover button {
        background: rgba(20, 0, 0, 0.7);
        border-color: #f55;
        color: #f55;
      }
      #combo {
        position: fixed;
        top: 42%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ff0;
        font-size: 28px;
        pointer-events: none;
        opacity: 0;
        text-shadow: 0 0 10px #f80;
        z-index: 2;
      }
      #combo.pop {
        animation: pop 0.25s ease-out;
      }
      @keyframes pop {
        0% {
          transform: translate(-50%, -50%) scale(1.6);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }
      #flash {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle,
          rgba(255, 0, 0, 0) 55%,
          rgba(255, 0, 0, 0.45) 100%
        );
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }
      #flash.hit {
        opacity: 1;
      }
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        opacity: 0;
        background: radial-gradient(
          circle,
          transparent 42%,
          rgba(180, 0, 0, 0.55) 100%
        );
        transition: opacity 0.08s linear;
      }
      #banner {
        position: fixed;
        top: 28%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.86);
        color: #eaffff;
        font-size: 22px;
        letter-spacing: 0.18em;
        pointer-events: none;
        opacity: 0;
        z-index: 6;
        text-shadow: 0 0 18px #0ff;
        white-space: nowrap;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      #banner.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      #fsbtn {
        position: fixed;
        top: max(10px, env(safe-area-inset-top, 0px));
        right: max(62px, calc(env(safe-area-inset-right, 0px) + 54px));
        color: #0ff;
        background: rgba(0, 20, 25, 0.5);
        border: 1px solid rgba(0, 255, 255, 0.4);
        min-width: 44px;
        min-height: 44px;
        padding: 6px 10px;
        pointer-events: auto;
        font-size: 13px;
        border-radius: 6px;
        backdrop-filter: blur(6px);
        z-index: 4;
        cursor: pointer;
        display: none;
      }
      body.ingame #fsbtn {
        display: block;
      }
      body.ingame #pause {
        display: block;
      }
      body:not(.ingame) #hud,
      body:not(.ingame) #wpn,
      body:not(.ingame) #pause,
      body:not(.ingame) #fsbtn,
      body:not(.ingame) .stick,
      body:not(.ingame) #shbtn {
        display: none !important;
      }
      #title {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(ellipse at 50% 30%, #0a2a33 0%, #050508 70%), #050508;
        color: #eaffff;
      }
      #title h1 {
        font-size: clamp(22px, 6vw, 42px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-shadow:
          0 0 22px #0ff,
          0 0 48px #0ff6;
        text-align: center;
        padding: 0 16px;
      }
      #title .sub {
        opacity: 0.7;
        font-size: 12px;
        letter-spacing: 0.28em;
        margin-top: -6px;
      }
      #title .btns {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        min-width: min(280px, 80vw);
      }
      #title button,
      #settings button,
      #highscore button,
      #menu button,
      #gameover button {
        padding: 10px 24px;
        min-height: 44px;
        min-width: 120px;
        background: rgba(0, 20, 25, 0.7);
        border: 1px solid #0ff;
        color: #0ff;
        font-family: inherit;
        border-radius: 6px;
        cursor: pointer;
        letter-spacing: 0.12em;
      }
      #title button:hover,
      #settings button:hover,
      #highscore button:hover,
      #menu button:hover {
        background: rgba(0, 229, 255, 0.18);
        box-shadow: 0 0 16px #0ff5;
      }
      #title button:focus-visible,
      #settings button:focus-visible,
      #highscore button:focus-visible,
      #menu button:focus-visible,
      #gameover button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      #highscore,
      #settings {
        position: fixed;
        inset: 0;
        background: #000c;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        z-index: 21;
        color: #eaffff;
      }
      #highscore p,
      #settings label {
        font-size: 14px;
        letter-spacing: 0.08em;
      }
      #settings .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: min(320px, 86vw);
        justify-content: space-between;
      }
      #settings input[type="range"] {
        width: 160px;
        accent-color: #00e5ff;
      }
      #rotatehint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #050508;
        color: #0ff;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        text-align: center;
        padding: 24px;
        letter-spacing: 0.14em;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotatehint {
          display: flex;
        }
      }
      #gameover button {
        background: rgba(20, 0, 0, 0.7);
        border-color: #f55;
        color: #f55;
      }
      .lowq #hud {
        backdrop-filter: none;
      }
      .lowq .stick,
      .lowq #wpn,
      .lowq #pause,
      .lowq #fsbtn,
      .lowq #shbtn {
        backdrop-filter: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="hudrow">
        WAVE <span id="wave">1</span> | HP <span id="hp">100</span> | SCORE
        <span id="score">0</span>
      </div>
      <div class="meters">
        <div class="meter">
          <span>HEAT</span>
          <div id="heat"><div id="heatfill"></div></div>
        </div>
        <div class="meter">
          <span>SHIELD</span>
          <div id="shld"><div id="shldfill"></div></div>
        </div>
      </div>
    </div>
    <div id="combo"></div>
    <div id="flash"></div>
    <div id="vignette"></div>
    <div id="banner"></div>
    <div id="pause" aria-label="Pause">II</div>
    <button id="fsbtn" type="button" aria-label="Fullscreen">FS</button>
    <div id="title">
      <h1>METAL SHATTER ARENA</h1>
      <div class="sub">NEON MECH COMBAT</div>
      <div class="btns">
        <button id="bplay" type="button">PLAY</button>
        <button id="bhs" type="button">HIGH SCORE</button>
        <button id="bset" type="button">SETTINGS</button>
      </div>
    </div>
    <div id="highscore">
      <h2>HIGH SCORE</h2>
      <p id="hsline">SCORE 0</p>
      <p id="bwline">BEST WAVE 1</p>
      <button id="bhsback" type="button">BACK</button>
    </div>
    <div id="settings">
      <h2>SETTINGS</h2>
      <div class="row">
        <label for="vol">VOLUME</label>
        <input id="vol" type="range" min="0" max="100" value="85" />
      </div>
      <div class="row">
        <span>MUTE (M)</span>
        <button id="bmute" type="button">Sound: On</button>
      </div>
      <div class="row">
        <span>QUALITY</span>
        <button id="bqual" type="button">HIGH</button>
      </div>
      <div class="row">
        <span>SCREEN SHAKE</span>
        <button id="bshake" type="button">ON</button>
      </div>
      <div class="row">
        <span>FULLSCREEN (F)</span>
        <button id="bfsset" type="button">OFF</button>
      </div>
      <button id="bsetback" type="button">BACK</button>
    </div>
    <div id="menu">
      <h2>PAUSED</h2>
      <button id="bres" type="button">Resume</button>
      <button id="brestart" type="button">Restart</button>
      <button id="bmenu" type="button">Title</button>
      <button id="bsound" type="button">Sound: On</button>
    </div>
    <div id="gameover">
      <h2>MECH DESTROYED</h2>
      <p id="finalwave"></p>
      <button id="brestart2" type="button">Restart</button>
      <button id="bgomenu" type="button">Title</button>
    </div>
    <div id="rotatehint">
      <div>ROTATE DEVICE</div>
      <div>LANDSCAPE REQUIRED</div>
    </div>
    <div class="stick" id="l"><div class="nub"></div></div>
    <div class="stick" id="r"><div class="nub"></div></div>
    <button id="shbtn" type="button" aria-label="Shield">SHIELD</button>
    <div id="wpn">[1]AUTOCANNON [2]PLASMA [3]ROCKET</div>
    <script>
      (function () {
        const cv = document.getElementById("c"),
          ctx = cv.getContext("2d", { alpha: false, desynchronized: true });
        if (!ctx) return;
        const IS_TEST = /(?:^|[?&])test=1(?:&|$)/.test(location.search);
        const IS_PERF = /(?:^|[?&])perf=1(?:&|$)/.test(location.search);
        const IS_STRESS = /(?:^|[?&])stress=1(?:&|$)/.test(location.search);
        const IS_BENCH = /(?:^|[?&])bench=1(?:&|$)/.test(location.search);
        const memSave = Object.create(null);
        function readStore() {
          try {
            const raw = localStorage.getItem("msa-v1");
            if (raw) {
              const o = JSON.parse(raw);
              if (o && typeof o === "object") return o;
            }
          } catch (e) {}
          return memSave;
        }
        function writeStore(partial) {
          const cur = readStore();
          for (const k in partial) cur[k] = partial[k];
          for (const k in cur) memSave[k] = cur[k];
          try {
            localStorage.setItem("msa-v1", JSON.stringify(cur));
          } catch (e) {}
        }
        const saved0 = readStore();
        let highScore = saved0.highScore | 0;
        let bestWave = saved0.bestWave | 0;
        if (bestWave < 1) bestWave = 1;
        let volume =
          saved0.volume == null
            ? 0.85
            : Math.max(0, Math.min(1, +saved0.volume || 0));
        let quality = 2;
        if (saved0.qTier != null) quality = saved0.qTier | 0;
        else if (saved0.quality === 0) quality = 0;
        if (quality < 0) quality = 0;
        if (quality > 2) quality = 2;
        let shakeOn = saved0.shake === 0 ? 0 : 1;
        let fsPref = saved0.fs ? 1 : 0;
        let inGame = 0;
        let W = 1,
          H = 1,
          DPR = Math.min(
            devicePixelRatio || 1,
            quality === 0 ? 1 : quality === 1 ? 1.5 : 2,
          );
        function resize() {
          DPR = Math.min(
            devicePixelRatio || 1,
            quality === 0 ? 1 : quality === 1 ? 1.5 : 2,
          );
          const vv = window.visualViewport;
          const nW = ((vv && vv.width) || innerWidth) | 0,
            nH = ((vv && vv.height) || innerHeight) | 0;
          const bw = (nW * DPR) | 0,
            bh = (nH * DPR) | 0;
          W = nW;
          H = nH;
          cv.style.width = W + "px";
          cv.style.height = H + "px";
          cv.style.left = ((vv && vv.offsetLeft) || 0) + "px";
          cv.style.top = ((vv && vv.offsetTop) || 0) + "px";
          if (cv.width === bw && cv.height === bh) return;
          cv.width = bw;
          cv.height = bh;
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.imageSmoothingEnabled = false;
        }
        addEventListener("resize", resize);
        addEventListener("orientationchange", resize);
        if (window.visualViewport) {
          visualViewport.addEventListener("resize", resize);
          visualViewport.addEventListener("scroll", resize);
        }
        try {
          if (window.matchMedia) {
            matchMedia("(resolution: 1dppx)").addEventListener(
              "change",
              resize,
            );
            matchMedia("(resolution: 2dppx)").addEventListener(
              "change",
              resize,
            );
          }
        } catch (e) {}
        resize();
        cv.addEventListener("contextlost", (e) => e.preventDefault());
        cv.addEventListener("webglcontextlost", (e) => e.preventDefault());
        cv.addEventListener("contextrestored", () => {
          resize();
          try {
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            ctx.imageSmoothingEnabled = false;
          } catch (e) {}
        });
        addEventListener(
          "touchstart",
          () => {
            document.body.classList.add("touch");
          },
          { once: true, passive: true },
        );

        const WW = 2000,
          WH = 1200,
          PR = 16,
          ACCEL = 520,
          FRICTION = 5.5,
          MAXSPD = 150,
          MAX_RANGE = 560;
        const EMASK = 96;
        const hudHp = document.getElementById("hp"),
          hudWave = document.getElementById("wave"),
          hudScore = document.getElementById("score");
        const heatFill = document.getElementById("heatfill"),
          shldFill = document.getElementById("shldfill"),
          wpnEl = document.getElementById("wpn"),
          comboEl = document.getElementById("combo");
        const flashEl = document.getElementById("flash"),
          menuEl = document.getElementById("menu"),
          goEl = document.getElementById("gameover");
        const finalWaveEl = document.getElementById("finalwave");
        const titleEl = document.getElementById("title"),
          hsEl = document.getElementById("highscore"),
          setEl = document.getElementById("settings");
        const bannerEl = document.getElementById("banner"),
          vignetteEl = document.getElementById("vignette");
        const volEl = document.getElementById("vol"),
          bmuteEl = document.getElementById("bmute"),
          bqualEl = document.getElementById("bqual"),
          bshakeEl = document.getElementById("bshake"),
          bfssetEl = document.getElementById("bfsset"),
          bsoundEl = document.getElementById("bsound");
        const hslineEl = document.getElementById("hsline"),
          bwlineEl = document.getElementById("bwline");
        let viewL = 0,
          viewT = 0,
          viewR = WW,
          viewB = WH;
        let maskLX = 0,
          maskLY = 0;
        let hipX = 0,
          hipY = 0;
        let lastHp = -1,
          lastHeat = -1,
          lastWave = -1,
          lastScore = -1,
          lastWpn = "",
          lastShld = -1,
          lastVg = -1;
        let bannerT = 0,
          fpsAcc = 0,
          fpsFrames = 0,
          fpsHiAcc = 0,
          fpsHiFrames = 0,
          accDt = 0,
          loopErrT = 0,
          wakeLock = null;
        const STEP = 1 / 60;
        const frameMs = new Float32Array(120);
        let frameMsI = 0,
          frameMsN = 0;
        const stressWork = IS_STRESS ? new Float32Array(4200) : null;
        let stressWorkN = 0,
          stressT0 = 0;
        const benchWork = IS_BENCH ? new Float32Array(2400) : null;
        let benchWorkN = 0,
          benchT0 = 0,
          benchMax = 0,
          benchSum = 0;
        let tFlow = 0,
          tNav = 0,

        // Enemies used to just accelerate in a straight line at the player every
        // frame with no awareness of obstacles at all, leaning entirely on
        // worldBounce to shove them out again after they'd already rammed into a
        // wall. That works for a single flat wall but falls apart at any notch,
        // narrow gap, or corner formed by two adjacent boxes: the AI keeps
        // re-choosing the same blocked straight-line heading every single frame,
        // so it just grinds against the same spot indefinitely instead of ever
        // routing around - the "constantly hitting obstacles and getting stuck,
        // not able to find a way around" bug. This casts a short ray toward the
        // target first; if it's clear, behave exactly as before (no cost change
        // in open areas). If it's blocked, it fans outward in both directions
        // (~17algo,34,51,69,92,114,137,160 degrees) and steers toward the first
        // heading that's actually clear, so the enemy curves around the obstacle
        // instead of walking into it.
        function steerAngle(en, dx, dy, d) {
          const baseAng = Math.atan2(dy, dx);
          const look0 = Math.min(110, d, 50 + en.r * 2),
            look1 = Math.min(220, d, 180);
          for (let li = 0; li < 2; li++) {
            const look = li === 0 ? look0 : look1;
            if (look < 10) continue;
            if (!rayBlocked(en.x, en.y, baseAng, look)) return baseAng;
            for (let k = 0; k < STEER_OFFS.length; k++) {
              const o = STEER_OFFS[k];
              if (!rayBlocked(en.x, en.y, baseAng + o, look))
                return baseAng + o;
              if (!rayBlocked(en.x, en.y, baseAng - o, look))
                return baseAng - o;
            }
          }
          return baseAng;
        }
        function update(dt) {
          if (player.dead) return;
          if (hitStop > 0) {
            hitStop -= dt;
            if (!IS_TEST) return;
          }
          {
            const t0 = IS_BENCH ? performance.now() : 0;
            navBudgetTick();
            if (IS_BENCH) tNav += performance.now() - t0;
          }
          {
            const t0 = IS_BENCH ? performance.now() : 0;
            computeFlowField();
            if (IS_BENCH) tFlow += performance.now() - t0;
          }
          if (mouseActive && !usingStickAim) {
            const screenPX = (player.x - cam.x) * cam.zoom + W * 0.5,
              screenPY = (player.y - cam.y) * cam.zoom + H * 0.5;
            player.ang = Math.atan2(mouseCSSY - screenPY, mouseCSSX - screenPX);
          }
          if (player.ifr > 0) player.ifr -= dt;
          if (player.heat >= 100) {
            player.overheat = 1;
            plasmaHumStop();
          }
          if (player.overheat) {
            player.heat -= dt * 40;
            if (player.heat <= 10) player.overheat = 0;
          } else player.heat = Math.max(0, player.heat - dt * 8);
          if (player.heat > 85 && Math.random() < 0.02) sndHeat();

          const kx =
            (keys.d || keys.arrowright ? 1 : 0) -
            (keys.a || keys.arrowleft ? 1 : 0);
          const ky =
            (keys.s || keys.arrowdown ? 1 : 0) -
            (keys.w || keys.arrowup ? 1 : 0);
          let mx, my;
          if (kx || ky) {
            const m = Math.hypot(kx, ky);
            mx = kx / m;
            my = ky / m;
          } else {
            mx = moveVec.x;
            my = moveVec.y;
          }
          const im = Math.hypot(mx, my);
          if (im > 0.08) {
            player.ax = (mx / im) * ACCEL;
            player.ay = (my / im) * ACCEL;
          } else {
            player.ax = -player.vx * FRICTION;
            player.ay = -player.vy * FRICTION;
          }
          player.vx += player.ax * dt;
          player.vy += player.ay * dt;
          let sp = Math.hypot(player.vx, player.vy);
          if (sp > MAXSPD) {
            player.vx *= MAXSPD / sp;
            player.vy *= MAXSPD / sp;
            sp = MAXSPD;
          }
          if (sp < 1e-4) {
            player.vx = 0;
            player.vy = 0;
            sp = 0;
          }
          player.x += player.vx * dt;
          player.y += player.vy * dt;
          worldBounce(player, PR, mx, my);
          updateIK(player, dt, sp);

          const moveSpeed = sp;
          if (moveSpeed > 8) {
            player.dist += moveSpeed * dt;
            const ta = Math.atan2(player.vy, player.vx);
            let da = Math.atan2(
              Math.sin(ta - player.bodyAng),
              Math.cos(ta - player.bodyAng),
            );
            player.bodyAng += da * 0.1;
          }

          player.shieldOn =
            (keys.shift || touchShield || padShield) && player.shieldHp > 0
              ? 1
              : 0;
          if (player.shieldOn) player.shieldAng = player.ang;
          if (player.shieldHitT > 0) player.shieldHitT -= dt;
          else if (!player.shieldOn && player.shieldHp < SHIELD_MAX)
            player.shieldHp = Math.min(SHIELD_MAX, player.shieldHp + dt * 10);

          fireT -= dt;
          const firing = mouseDown || fireHeld || padFire;
          if (player.overheat || player.dead) plasmaHumStop();
          else if (firing && fireT <= 0) {
            fireWeapon(dt);
            fireT = weapon === 1 ? 0 : weapon === 2 ? 0.6 : 0.09;
          } else if (firing && weapon === 1) fireWeapon(dt);
          if (!(firing && weapon === 1) || player.overheat) plasmaHumStop();

          for (let i = 0; i < bullets.length; i++) {
            const b = bullets[i];
            if (!b.active) continue;
            const ox = b.x,
              oy = b.y;
            b.life -= dt;
            b.tx2 = b.tx1;
            b.ty2 = b.ty1;
            b.tx1 = b.tx0;
            b.ty1 = b.ty0;
            b.tx0 = b.x;
            b.ty0 = b.y;
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            if (b.from === 1 && b.type === 2 && quality > 0)
              spawnParticle(b.x, b.y, "#fa6", 8, -b.vx * 0.12, -b.vy * 0.12);
            if (b.life <= 0 || b.x < 0 || b.y < 0 || b.x > WW || b.y > WH) {
              if (b.type === 2 && b.from === 1) rocketExplode(b.x, b.y);
              b.active = 0;
              continue;
            }
            const dist = Math.hypot(b.x - ox, b.y - oy);
            const steps = Math.max(1, Math.ceil(dist / 6));
            let hitV = 0,
              hx = b.x,
              hy = b.y;
            for (let s = 1; s <= steps; s++) {
              hx = ox + ((b.x - ox) * s) / steps;
              hy = oy + ((b.y - oy) * s) / steps;
              if (solidAt(hx, hy)) {
                hitV = 1;
                break;
              }
            }
            if (hitV) {
              if (b.type === 2 && b.from === 1) rocketExplode(hx, hy);
              else if (b.from === 1) {
                impact(hx, hy, b.type === 1 ? 14 : 8, 3);
                sndCrunch(0.8, hx, hy, Math.hypot(b.vx, b.vy));
                const nx = b.vx,
                  ny = b.vy,
                  nl = Math.hypot(nx, ny) || 1;
                spawnParticle(
                  hx,
                  hy,
                  "#fff",
                  0,
                  (-nx / nl) * 180,
                  (-ny / nl) * 180,
                );
              } else {
                spawnParticle(hx, hy, "#f86", 6, 0, 0);
              }
              b.active = 0;
              continue;
            }
            if (b.from === 1) {
              for (let j = 0; j < enemies.length; j++) {
                const en = enemies[j];
                if (en.hp <= 0) continue;
                const dx = b.x - en.x,
                  dy = b.y - en.y;
                if (
                  dx * dx + dy * dy < (en.r + 4) * (en.r + 4) &&
                  enemySolidAt(en, b.x, b.y)
                ) {
                  if (b.type === 2) rocketExplode(b.x, b.y);
                  else {
                    if (b.type === 0)
                      eraseEnemyDeep(en, b.x, b.y, voxelR(0, en), b.vx, b.vy);
                    damageEnemy(
                      en,
                      b.x,
                      b.y,
                      b.dmg,
                      b.type === 0 ? 0 : voxelR(b.type, en),
                    );
                    impactFX(b.x, b.y, 8, 2);
                    spawnPopup(b.x, b.y, Math.round(b.dmg / (en.armor || 1)));
                    addCombo();
                  }
                  b.active = 0;
                  break;
                }
              }
            } else {
              const dx = b.x - player.x,
                dy = b.y - player.y;
              if (dx * dx + dy * dy < PR * PR) {
                hurt(b.dmg, b.x, b.y);
                spawnParticle(b.x, b.y, "#f86", 6, 0, 0);
                b.active = 0;
              }
            }
          }

          for (let i = 0; i < debris.length; i++) {
            const d = debris[i];
            if (!d.active) continue;
            d.life -= dt;
            if (d.life <= 0) {
              d.active = 0;
              continue;
            }
            const dd = Math.exp(-1.8 * dt);
            d.vx *= dd;
            d.vy *= dd;
            d.x += d.vx * dt;
            d.y += d.vy * dt;
            if (d.x < 0 || d.y < 0 || d.x > WW || d.y > WH) {
              d.active = 0;
              continue;
            }
            worldBounce(d, d.r, 0, 0);
            const mom = d.mass * Math.hypot(d.vx, d.vy);
            if (mom < 4) continue;
            for (let j = 0; j < enemies.length; j++) {
              const en = enemies[j];
              if (en.hp <= 0) continue;
              const dx = d.x - en.x,
                dy = d.y - en.y,
                rad = en.r + d.r,
                dd = dx * dx + dy * dy;
              if (dd < rad * rad && enemySolidAt(en, d.x, d.y)) {
                const dist = Math.sqrt(dd) || 1,
                  nx = dx / dist,
                  ny = dy / dist;
                damageEnemy(en, d.x, d.y, Math.min(8, mom * 0.08), 2);
                reflect(d, nx, ny);
                d.vx *= 0.4;
                d.vy *= 0.4;
                // Push the debris fully outside the enemy's radius immediately,
                // with a little extra clearance. Without this it can stay
                // overlapping for several frames (its own speed is often too low
                // to escape in one step), re-triggering this block and looking
                // like it's rattling in place against the enemy. The extra margin
                // also helps it clear a second nearby enemy in one shot when
                // several are clustered together, instead of immediately
                // re-colliding with the neighbor.
                const pen = rad - dist;
                d.x += nx * (pen + 1.5);
                d.y += ny * (pen + 1.5);
              }
            }
          }
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (!p.active) continue;
            p.life -= dt;
            if (p.life <= 0) {
              p.active = 0;
              continue;
            }
            const pd = Math.exp(
              (p.type === 1 ? -1.2 : p.type === 8 ? -2.4 : -2.6) * dt,
            );
            p.vx *= pd;
            p.vy *= pd;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
          }
          for (let i = 0; i < popups.length; i++) {
            const pu = popups[i];
            if (!pu.active) continue;
            pu.life -= dt;
            if (pu.life <= 0) {
              pu.active = 0;
              continue;
            }
            pu.y -= 30 * dt;
          }
          if (flashT > 0) {
            flashT -= dt;
            if (flashT <= 0) flashEl.classList.remove("hit");
          }
          if (bannerT > 0) {
            bannerT -= dt;
            if (bannerT <= 0) bannerEl.classList.remove("show");
          }

          if (player.combo > 0) {
            player.comboTimer -= dt;
            if (player.comboTimer <= 0) {
              player.combo = 0;
              comboEl.style.opacity = "0";
            }
          }

          let alive = 0;
          for (let i = 0; i < enemies.length; i++) {
            const en = enemies[i];
            if (en.hp <= 0) continue;
            alive++;
            const dx = player.x - en.x,
              dy = player.y - en.y,
              d = Math.hypot(dx, dy) || 1;
            const targetAng = Math.atan2(dy, dx);
            let da = Math.atan2(
              Math.sin(targetAng - en.ang),
              Math.cos(targetAng - en.ang),
            );
            en.ang += da * Math.min(1, dt * 4);
            let spd2 = typeSpeed(en);
            if (en.legsBroken) spd2 *= 0.35;
            let sAng = d < NAV_CELL * 1.4 ? targetAng : flowAngle(en);
            if (sAng === null) sAng = steerAngle(en, dx, dy, d);
            en.ax = Math.cos(sAng) * spd2 * 3.2;
            en.ay = Math.sin(sAng) * spd2 * 3.2;
            en.vx += en.ax * dt;
            en.vy += en.ay * dt;
            const esp = Math.hypot(en.vx, en.vy),
              emax = spd2;
            if (esp > emax) {
              en.vx *= emax / esp;
              en.vy *= emax / esp;
            }
            const minD = PR + en.r;
            if (esp < 3 && d > minD) {
              en.idle = (en.idle || 0) + dt;
              if (en.idle > 0.45) {
                en.vx += Math.cos(targetAng) * spd2;
                en.vy += Math.sin(targetAng) * spd2;
                en.idle = 0;
              }
            } else en.idle = 0;
            en.x += en.vx * dt;
            en.y += en.vy * dt;
            worldBounce(en, en.r, en.ax, en.ay);
            if (d < minD) {
              const nx = dx / d,
                ny = dy / d,
                pen = minD - d;
              player.x += nx * pen * 0.55;
              player.y += ny * pen * 0.55;
              en.x -= nx * pen * 0.45;
              en.y -= ny * pen * 0.45;
              if (player.ifr <= 0) {
                reflect(player, -nx, -ny);
                player.vx *= 0.5;
                player.vy *= 0.5;
                hurt(10, en.x, en.y);
              }
            }
            if (en.flashT > 0) en.flashT -= dt;
            if (en.chargeT > 0) {
              en.chargeT -= dt;
              en.chargeAng = targetAng;
              if (en.chargeT <= 0) {
                spawnEbullet(en, targetAng);
                spawnParticle(
                  en.x + Math.cos(targetAng) * en.r,
                  en.y + Math.sin(targetAng) * en.r,
                  "#fff",
                  6,
                  Math.cos(targetAng) * 40,
                  Math.sin(targetAng) * 40,
                );
              }
            }
            en.fireT -= dt;
            if (en.fireT <= 0 && d < 500 && en.chargeT <= 0) {
              en.fireT = en.coreExposed ? 1.6 : 1.1;
              en.chargeT = 0.25;
              en.chargeAng = targetAng;
            }
            if (en.coreExposed && quality > 0 && Math.random() < dt * 8)
              spawnParticle(
                en.x + (Math.random() - 0.5) * 8,
                en.y + (Math.random() - 0.5) * 8,
                "#8887",
                1,
                en.vx * 0.4,
                en.vy * 0.4,
              );
            for (let k = i + 1; k < enemies.length; k++) {
              const o = enemies[k];
              if (o.hp <= 0) continue;
              const ox = en.x - o.x,
                oy = en.y - o.y,
                od = Math.hypot(ox, oy),
                need = en.r + o.r;
              if (od < need && od > 0) {
                const p = ((need - od) * 0.5) / od;
                en.x += ox * p;
                en.y += oy * p;
                o.x -= ox * p;
                o.y -= oy * p;
              }
            }
          }
          let ew = 0;
          for (let i = 0; i < enemies.length; i++) {
            if (enemies[i].hp > 0) {
              if (ew !== i) enemies[ew] = enemies[i];
              ew++;
            } else {
              retMask(enemies[i].mask);
              enemies[i].mask = null;
              enemies[i].mctx = null;
              enemies[i].maskAlpha = null;
              enemies[i].maskImg = null;
              enemyPool.push(enemies[i]);
            }
          }
          enemies.length = ew;
          if (alive === 0 && allowWave) {
            persistScores();
            const cleared = wave;
            wave++;
            if (wave % 5 === 0) showBanner("BOSS WAVE " + wave);
            else showBanner("WAVE " + cleared + " CLEARED");
            newWave(3 + wave);
          }

          shake = Math.max(0, shake - dt * 30);
          explosionZoom = Math.max(0, explosionZoom - dt * 0.6);
          const leadX = player.x + player.vx * 0.25,
            leadY = player.y + player.vy * 0.25;
          cam.x += (leadX - cam.x) * Math.min(1, dt * 4);
          cam.y += (leadY - cam.y) * Math.min(1, dt * 4);
          const targetZoom = 1 - Math.min(0.18, sp * 0.0016) - explosionZoom;
          cam.zoom += (targetZoom - cam.zoom) * Math.min(1, dt * 3);
          const halfW = W / (2 * cam.zoom),
            halfH = H / (2 * cam.zoom);
          if (WW <= halfW * 2) cam.x = WW * 0.5;
          else cam.x = Math.max(halfW, Math.min(WW - halfW, cam.x));
          if (WH <= halfH * 2) cam.y = WH * 0.5;
          else cam.y = Math.max(halfH, Math.min(WH - halfH, cam.y));
        }

        function syncHUD() {
          const hp = Math.max(0, player.hp | 0);
          if (hp !== lastHp) {
            hudHp.textContent = hp;
            lastHp = hp;
          }
          const h = player.heat | 0;
          if (h !== lastHeat) {
            heatFill.style.width = player.heat + "%";
            lastHeat = h;
          }
          const sh = Math.max(0, player.shieldHp | 0);
          if (sh !== lastShld) {
            shldFill.style.width = (player.shieldHp / SHIELD_MAX) * 100 + "%";
            lastShld = sh;
          }
          if (wave !== lastWave) {
            hudWave.textContent = wave;
            lastWave = wave;
          }
          if (score !== lastScore) {
            hudScore.textContent = score;
            lastScore = score;
          }
          const vg = player.hp < 55 ? (((55 - player.hp) / 55) * 100) | 0 : 0;
          if (vg !== lastVg) {
            lastVg = vg;
            vignetteEl.style.opacity = vg ? String(vg / 100) : "0";
          }
          const ws = weapon;
          if (ws !== lastWpn) {
            wpnEl.innerHTML =
              "<span" +
              (weapon === 0
                ? "><b>[1]AUTOCANNON</b>"
                : ' style="opacity:.55">[1]AUTOCANNON') +
              "</span><span" +
              (weapon === 1
                ? "><b>[2]PLASMA</b>"
                : ' style="opacity:.55">[2]PLASMA') +
              "</span><span" +
              (weapon === 2
                ? "><b>[3]ROCKET</b>"
                : ' style="opacity:.55">[3]ROCKET') +
              "</span>";
            lastWpn = ws;
          }
        }

        function drawMech(p) {
          const th = p.bodyAng,
            ta = p.ang;
          if (p.legs) {
            ctx.save();
            ctx.strokeStyle = p.overheat ? "#a44" : "#067a88";
            ctx.lineWidth = 3.2;
            ctx.lineCap = "round";
            ctx.fillStyle = p.overheat ? "#f86" : "#00e5ff";
            for (let i = 0; i < p.legs.length; i++) {
              const L = p.legs[i];
              hipOf(p, L.side);
              ctx.beginPath();
              ctx.moveTo(hipX, hipY);
              ctx.lineTo(L.fx, L.fy);
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(L.fx, L.fy, 3.1, 0, 6.283185);
              ctx.fill();
            }
            ctx.restore();
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.save();
          ctx.rotate(th);
          if (quality > 0)
            ctx.drawImage(p.overheat ? glowRed : glowCyan, -22, -22, 44, 44);
          ctx.fillStyle = p.overheat ? "#a33" : "#063a44";
          ctx.fillRect(-11, -11, 22, 22);
          ctx.fillStyle = p.overheat ? "#ff6b4a" : "#00e5ff";
          ctx.fillRect(-8, -8, 16, 16);
          ctx.fillStyle = "#051014";
          ctx.fillRect(-4, -7, 8, 7);
          ctx.restore();
          ctx.save();
          ctx.rotate(ta);
          ctx.fillStyle =
            weapon === 1 ? "#4ef" : weapon === 2 ? "#fa6" : "#ffe27a";
          ctx.fillRect(6, -3, 18, 6);
          ctx.fillStyle = "#fff";
          ctx.globalAlpha = 0.55;
          ctx.fillRect(20, -1.5, 5, 3);
          ctx.globalAlpha = 1;
          ctx.restore();
          ctx.restore();
          if (p.shieldOn && p.shieldHp > 0) {
            ctx.save();
            ctx.translate(p.x, p.y);
            const a = 0.45 + 0.5 * (p.shieldHp / SHIELD_MAX);
            ctx.strokeStyle = "#00e5ff";
            ctx.globalAlpha = a;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(
              0,
              0,
              26,
              p.shieldAng - SHIELD_ARC,
              p.shieldAng + SHIELD_ARC,
            );
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.restore();
          }
        }
        function drawEnemy(en) {
          if (en.hp <= 0) return;
          ctx.save();
          ctx.translate(en.x, en.y);
          ctx.rotate(en.ang);
          if (en.coreExposed && quality > 0) {
            ctx.globalAlpha = 0.35;
            ctx.drawImage(
              glowRed,
              -en.r * 0.7,
              -en.r * 0.7,
              en.r * 1.4,
              en.r * 1.4,
            );
            ctx.globalAlpha = 1;
          }
          if (en.maskDirty) {
            ctx.globalAlpha = 0.4;
            ctx.drawImage(
              glowOrange,
              -EMASK * 0.25,
              -EMASK * 0.25,
              EMASK * 0.5,
              EMASK * 0.5,
            );
            ctx.globalAlpha = 1;
          }
          ctx.drawImage(en.mask, -EMASK * 0.5, -EMASK * 0.5);
          if (en.flashT > 0) {
            ctx.globalAlpha = Math.min(1, en.flashT / 0.08);
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(0, 0, en.r * 0.9, 0, 6.283185);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          if (en.chargeT > 0) {
            ctx.strokeStyle = "#fff";
            ctx.globalAlpha = 0.55 + 0.45 * (1 - en.chargeT / 0.25);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, en.r + 10 - en.chargeT * 16, 0, 6.283185);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          if (en.type === 2 && en.shieldHp > 0) {
            ctx.strokeStyle = "#78c8ff";
            ctx.globalAlpha = 0.3 + (0.5 * en.shieldHp) / 60;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, en.r + 6, 0, 6.283185);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          ctx.restore();
        }
        function render() {
          ctx.fillStyle = "#111";
          ctx.fillRect(0, 0, W, H);
          ctx.save();
          try {
            const sx = shake ? (Math.random() - 0.5) * shake : 0,
              sy = shake ? (Math.random() - 0.5) * shake : 0;
            ctx.translate(W * 0.5 + sx, H * 0.5 + sy);
            ctx.scale(cam.zoom, cam.zoom);
            ctx.translate(-cam.x, -cam.y);
            refreshView();
            {
              let sx = viewL | 0,
                sy = viewT | 0,
                sw = (viewR - viewL) | 0,
                sh = (viewB - viewT) | 0;
              if (sx < 0) {
                sw += sx;
                sx = 0;
              }
              if (sy < 0) {
                sh += sy;
                sy = 0;

            const r0 = IS_BENCH ? performance.now() : 0;
            render();
            if (IS_BENCH) tRender += performance.now() - r0;
          } catch (e) {
            if (t - loopErrT > 1000) {
              loopErrT = t;
              console.error(e);
            }
          }
          const fms = performance.now() - frameT0;
          frameMs[frameMsI] = fms;
          frameMsI = (frameMsI + 1) % 120;
          if (frameMsN < 120) frameMsN++;
          if (
            stressWork &&
            stressT0 &&
            t - stressT0 > 2000 &&
            stressWorkN < stressWork.length
          )
            stressWork[stressWorkN++] = fms;
          if (benchWork && benchT0 && t - benchT0 > 500) {
            if (fms > benchMax) benchMax = fms;
            benchSum += fms;
            if (benchWorkN < benchWork.length) benchWork[benchWorkN++] = fms;
          }
          fpsAcc += dt;
          fpsFrames++;
          if (fpsAcc >= 1) {
            const fps = fpsFrames / fpsAcc;
            fpsAcc = 0;
            fpsFrames = 0;
            if (!IS_BENCH && !IS_STRESS) {
              if (fps < 50 && quality > 0) setQuality(quality - 1);
              if (fps >= 58) {
                fpsHiAcc += 1;
                if (fpsHiAcc >= 5 && quality < 2) {
                  setQuality(quality + 1);
                  fpsHiAcc = 0;
                }
              } else fpsHiAcc = 0;
            }
            if (perfEl) {
              let enN = 0,
                bN = 0,
                pN = 0,
                dN = 0;
              for (let i = 0; i < enemies.length; i++)
                if (enemies[i].hp > 0) enN++;
              bN = countActive(bullets);
              pN = countActive(particles);
              dN = countActive(debris);
              perfEl.textContent =
                "fps " +
                fps.toFixed(1) +
                "\nms " +
                fms.toFixed(1) +
                " p95 " +
                p95ms().toFixed(1) +
                "\nen " +
                enN +
                " b " +
                bN +
                " p " +
                pN +
                " d " +
                dN +
                " q " +
                quality;
            }
          }
        }
        requestAnimationFrame(loop);
        if (IS_STRESS && !IS_TEST) {
          startPlay();
          allowWave = 0;
          for (let i = 0; i < 20; i++) {
            const a = (i / 20) * 6.283185;
            spawnEnemy(
              i % 3,
              player.x + Math.cos(a) * 280,
              player.y + Math.sin(a) * 280,
            );
          }
          mouseDown = 1;
          stressT0 = performance.now();
          function stressTick(now) {
            if (weapon === 0 && now - stressT0 > 20000) weapon = 1;
            else if (weapon === 1 && now - stressT0 > 40000) weapon = 2;
            mouseDown = 1;
            if (now - stressT0 < 60000) requestAnimationFrame(stressTick);
            else {
              const n = stressWorkN;
              const dts = stressWork.subarray(0, n);
              dts.sort();
              window.__MSA_STRESS = {
                p95: n > 0 ? dts[Math.min(n - 1, (n * 0.95) | 0)] : 0,
                p99: n > 0 ? dts[Math.min(n - 1, (n * 0.99) | 0)] : 0,
                n: n,
              };
            }
          }
          requestAnimationFrame(stressTick);
        }
        if (IS_BENCH && !IS_TEST) {
          startPlay();
          allowWave = 0;
          for (let i = 0; i < enemies.length; i++) {
            retMask(enemies[i].mask);
            enemies[i].mask = null;
            enemies[i].mctx = null;
            enemies[i].maskAlpha = null;
            enemies[i].maskImg = null;
            enemyPool.push(enemies[i]);
          }
          enemies.length = 0;
          for (let i = 0; i < 15; i++) {
            const a = (i / 15) * 6.283185;
            spawnEnemy(
              i % 3,
              player.x + Math.cos(a) * 280,
              player.y + Math.sin(a) * 280,
            );
          }
          mouseDown = 1;
          benchT0 = performance.now();
          function benchTick(now) {
            const el = now - benchT0;
            weapon = el < 10000 ? 0 : el < 20000 ? 1 : 2;
            player.ang = el * 0.0015;
            mouseDown = 1;
            if (el < 30000) requestAnimationFrame(benchTick);
            else {
              const n = benchWorkN;
              const dts = benchWork.subarray(0, n);
              dts.sort();
              const avg = n ? benchSum / n : 0;
              const p95 = n > 0 ? dts[Math.min(n - 1, (n * 0.95) | 0)] : 0;
              const p99 = n > 0 ? dts[Math.min(n - 1, (n * 0.99) | 0)] : 0;
              const result = {
                avg: avg,
                p95: p95,
                p99: p99,
                max: benchMax,
                n: n,
                flow: tFlow,
                nav: tNav,
                update: Math.max(0, tUpdate - tFlow - tNav),
                render: tRender,
                audio: tAudio,
              };
              window.__MSA_BENCH = result;
              console.log(
                "BENCH avg",
                avg,
                "p95",
                p95,
                "p99",
                p99,
                "max",
                benchMax,
                "flow",
                tFlow,
                "nav",
                tNav,
                "update",
                result.update,
                "render",
                tRender,
                "audio",
                tAudio,
              );
            }
          }
          requestAnimationFrame(benchTick);
        }
        titleEl.addEventListener("pointerdown", unlockAudio, { once: true });
        addEventListener("error", (e) => {
          try {
            console.error(e && e.error ? e.error : e);
          } catch (err) {}
        });
        addEventListener("unhandledrejection", (e) => {
          try {
            console.error(e && e.reason ? e.reason : e);
          } catch (err) {}
        });
        cv.addEventListener("contextmenu", (e) => e.preventDefault());
        if (
          "serviceWorker" in navigator &&
          !IS_TEST &&
          !IS_STRESS &&
          !IS_BENCH
        ) {
          navigator.serviceWorker
            .register("sw.js", { scope: "./" })
            .catch(() => {});
        }
      })();
    </script>
  </body>
</html>
